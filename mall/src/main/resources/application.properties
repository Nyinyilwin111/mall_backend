spring.application.name=mall
server.port=8081

# --- JPA Settings ---
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# ----------- MySQL Settings ----------
# ========== MAIN DATABASE ==========
spring.datasource.url=jdbc:mysql://localhost:3306/database
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.main.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== AUDIT DATABASE ==========
spring.datasource.audit.url=jdbc:mysql://localhost:3306/auditlog
spring.datasource.audit.username=root
spring.datasource.audit.password=root
spring.datasource.audit.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# --- Data Initialization Settings ---
spring.sql.init.mode=never
#spring.jpa.defer-datasource-initialization=true

#--------------- available file size -------------------
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

