# ======= available file size ========
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ======== Jackson configuration for Java 8 date/time ========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true
spring.jackson.time-zone=Asia/Yangon

# =========== Temporary disable the requirement for Java 8 time handlers ============
spring.jackson.mapper.require-handlers-for-java8-times=false

# Increase JSON nesting depth to handle complex objects
spring.jackson.stream-write-constraints.max-nesting-depth=5000

