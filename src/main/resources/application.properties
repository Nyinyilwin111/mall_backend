spring.application.name=mall
server.port=8081

# --- JPA Settings ---
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# --- MySQL Settings ---
spring.datasource.url=jdbc:mysql://localhost:3306/lease_management
spring.datasource.username=root
spring.datasource.password=112018

# --- Init Settings ---
spring.sql.init.mode=never

# --- AWS S3 credentials ---
cloud.aws.region.static=ap-southeast-1
cloud.aws.credentials.access-key=AKIA6GVXXVXWKBNWJW43
cloud.aws.credentials.secret-key=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
cloud.aws.s3.bucket=kzt-image-storage-test

# --- File upload settings ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.com.spring=DEBUG
logging.level.software.amazon.awssdk=INFO