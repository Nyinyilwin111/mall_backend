# ========== JASPER REPORTS CONFIGURATION ==========
# JasperReports compilation and export settings
jasper.reports.compiler.class=net.sf.jasperreports.engine.design.JRJdtCompiler
jasper.reports.export.pdf.force.linebreak.policy=false

# Virtualizer settings for large reports (optional)
jasper.reports.virtualizer.activated=true
jasper.reports.virtualizer.max.size=100

# Font configurations for PDF export
jasper.reports.export.pdf.embedded=true
jasper.reports.export.pdf.force.svg.shapes=true

# Report storage directories
jasper.report.directory=classpath:reports/
jasper.output.directory=./generated-reports/

# Enable JRBeanCollectionDataSource optimization
spring.jasper.reports.enabled=true

# Logging for JasperReports (debug if needed)
logging.level.net.sf.jasperreports=INFO