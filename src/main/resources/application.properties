spring.datasource.audit.username=root
spring.datasource.audit.password=root
spring.datasource.audit.driver-class-name=com.mysql.cj.jdbc.Driver

# application.properties - ADD THESE
# Disable main datasource auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Explicit transaction timeout
spring.jpa.properties.javax.persistence.transactionType=RESOURCE_LOCAL

# Better connection pooling
spring.datasource.main.hikari.maximum-pool-size=10
spring.datasource.audit.hikari.maximum-pool-size=5

# ===== FOR WEBSOCKET=====
#spring.websocket.enabled=true


# ====== Data Initialization Settings =====
spring.sql.init.mode=never

# ======= available file size ========
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ======== Jackson configuration for Java 8 date/time ========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true
spring.jackson.time-zone=Asia/Yangon

# =========== Temporary disable the requirement for Java 8 time handlers ============
spring.jackson.mapper.require-handlers-for-java8-times=false

# Increase JSON nesting depth to handle complex objects
spring.jackson.stream-write-constraints.max-nesting-depth=5000


